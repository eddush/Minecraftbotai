<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EddyBotAI Dashboard</title>
<style>
body{margin:0;background:#090e1b;color:#eef;font:14px Arial,sans-serif}header{padding:14px;background:#111a2d;display:flex;justify-content:space-between}main{display:grid;grid-template-columns:2fr 1fr;gap:14px;padding:14px}.card{background:#111a2d;border:1px solid #26365d;border-radius:12px;padding:12px;margin-bottom:14px}.viewer{width:100%;height:540px;border:0;background:#000;border-radius:8px}.console{height:260px;overflow:auto;background:#050811;padding:10px;white-space:pre-wrap;font:12px monospace;border-radius:8px}.row{display:flex;gap:8px}.row>*{flex:1}input,textarea{box-sizing:border-box;width:100%;background:#080d18;color:white;border:1px solid #34466f;border-radius:8px;padding:10px}button{background:#705cff;color:#fff;border:0;border-radius:8px;padding:10px;font-weight:bold;cursor:pointer}.chat{max-height:180px;overflow:auto}.msg{padding:5px;border-bottom:1px solid #26365d}.err{color:#ff8d8d}.ok{color:#69f0a1}@media(max-width:850px){main{grid-template-columns:1fr}.viewer{height:420px}}
</style>
</head>
<body>
<header><b>🤖 EddyBotAI</b><span id="top">Connecting...</span></header>
<main>
<section>
<div class="card"><h3>👁️ What the bot sees</h3><iframe id="viewer" class="viewer" src="/viewer/" allow="fullscreen"></iframe></div>
<div class="card"><h3>🖥️ Console</h3><div id="logs" class="console">Connecting to API...</div></div>
</section>
<aside>
<div class="card"><h3>🤖 Status</h3><div id="status">Connecting...</div></div>
<div class="card"><h3>🧠 AI task</h3><textarea id="task" rows="5" placeholder="Tell the AI what to do..."></textarea><div class="row" style="margin-top:8px"><button id="send">Send task</button><button id="stop">Stop</button></div><p id="result"></p></div>
<div class="card"><h3>💬 Chat</h3><div id="chat" class="chat">Loading chat...</div><div class="row" style="margin-top:8px"><input id="msg" placeholder="Message Minecraft chat"><button id="chatBtn">Send</button></div></div>
</aside>
</main>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function api(path,options){
  const opts=options||{};
  opts.headers=Object.assign({'Content-Type':'application/json'},opts.headers||{});
  const r=await fetch(path,opts);
  const text=await r.text();
  let data; try{data=JSON.parse(text)}catch(e){throw new Error('HTTP '+r.status+': '+text.slice(0,200));}
  if(!r.ok)throw new Error(data.error||('HTTP '+r.status));
  return data;
}
async function refresh(){
  try{
    const s=await api('/api/status');
    $('top').innerHTML=s.connected?'<span class="ok">🟢 Online</span>':'<span class="err">🔴 Offline</span>';
    $('status').innerHTML='<b>'+esc(s.bot)+'</b><br>Version: '+esc(s.version)+'<br>Server: '+esc(s.server)+'<br>Position: '+(s.position?esc(s.position.x+', '+s.position.y+', '+s.position.z):'—')+'<br>Task: '+(s.busy?'Running':'Idle');
    const l=await api('/api/logs');
    $('logs').textContent=(l.logs||[]).map(x=>'['+new Date(x.time).toLocaleTimeString()+'] '+x.message).join('\n');
    $('logs').scrollTop=$('logs').scrollHeight;
    const c=await api('/api/chat');
    $('chat').innerHTML=(c.chat||[]).map(x=>'<div class="msg"><b>'+esc(x.username)+'</b>: '+esc(x.message)+'</div>').join('')||'No chat yet';
  }catch(e){
    $('top').innerHTML='<span class="err">⚠ '+esc(e.message)+'</span>';
    $('status').innerHTML='<span class="err">API error: '+esc(e.message)+'</span>';
    $('logs').textContent='API error: '+e.message;
  }
}
$('send').onclick=async function(){
  const v=$('task').value.trim();if(!v)return;
  $('result').textContent='Sending...';
  try{const d=await api('/api/task',{method:'POST',body:JSON.stringify({request:v})});$('result').textContent=d.result?.message||JSON.stringify(d.result);}catch(e){$('result').innerHTML='<span class="err">Error: '+esc(e.message)+'</span>';}finally{refresh();}
};
$('stop').onclick=async function(){
  try{const d=await api('/api/task',{method:'POST',body:JSON.stringify({request:'Stop moving immediately'})});$('result').textContent=d.result?.message||'Stopped';}catch(e){$('result').innerHTML='<span class="err">Error: '+esc(e.message)+'</span>';}finally{refresh();}
};
$('chatBtn').onclick=async function(){
  const v=$('msg').value.trim();if(!v)return;
  try{await api('/api/chat',{method:'POST',body:JSON.stringify({message:v}));$('msg').value='';refresh();}catch(e){alert(e.message);}
};
$('msg').addEventListener('keydown',e=>{if(e.key==='Enter')$('chatBtn').click();});
refresh();setInterval(refresh,2500);
})();
</script>
</body>
</html>
